<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" role="img" aria-labelledby="t d">
  <title id="t">Árbol de topics del broker de la Raspberry Pi</title>
  <desc id="d">Bajo invernadero cuelgan siete nodos (dht11, dht22, balanza, ultrasonidos, suelo, tds y actuador) con sus magnitudes y un topic online que genera la Raspberry Pi. El patrón invernadero/+/+ recoge exactamente esos topics de tres niveles. Bajo invernadero/shelly cuelgan el estado, la potencia, la energía y la disponibilidad de cada Shelly, y los topics de comando en los que publicas tú; invernadero/shelly/# los recoge todos.</desc>
  <defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
