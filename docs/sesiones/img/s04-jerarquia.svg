<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">Jerarquía de configuración de Dashboard 2.0</title>
  <desc id="d">Un nodo ui-base define la aplicación del panel en /dashboard. Dentro, cada ui-page es una página con su ruta (/invernadero), su disposición en rejilla y su tema. Cada página contiene grupos ui-group con un ancho en columnas de una rejilla de 12: Estado del sistema ocupa 12, Clima, Riego y agua y Actuadores ocupan 4 cada uno. Dentro de cada grupo van los widgets: gauges, textos, interruptores, gráficas. La URL resultante es /dashboard/invernadero.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1e293b; }
    .titulo { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: #475569; }
    .codigo { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; fill: #1e293b; }
    .w { font-size: 11px; }
  </style>

  <rect class="superficie" x="0.5" y="0.5" width="899" height="429" rx="12" fill="#fcfcfb" stroke="#e5e7eb"/>

  <!-- ui-base -->
  <rect x="20" y="20" width="860" height="360" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="36" y="44" class="titulo">ui-base</text>
  <text x="100" y="44" class="sub">la aplicación del panel · </text>
  <text x="248" y="44" class="codigo">path: /dashboard</text>

  <!-- ui-page -->
  <rect x="40" y="60" width="820" height="304" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="84" class="titulo">ui-page</text>
  <text x="122" y="84" class="sub">Invernadero · </text>
  <text x="206" y="84" class="codigo">path: /invernadero · layout: grid · tema</text>

  <!-- Rejilla de 12 columnas -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="60" y1="96" x2="840" y2="96"/>
  </g>
  <g class="sub" font-size="10" fill="#94a3b8">
    <text x="60" y="108" style="font-size:10px;fill:#94a3b8">1</text>
    <text x="827" y="108" style="font-size:10px;fill:#94a3b8">12</text>
  </g>

  <!-- ui-group: Estado (12) -->
  <rect x="60" y="114" width="780" height="64" rx="8" fill="#fcfcfb" stroke="#0d9488" stroke-width="1.5"/>
  <text x="74" y="134" class="titulo">ui-group · Estado del sistema</text>
  <text x="826" y="134" text-anchor="end" class="sub">ancho 12</text>
  <rect x="74" y="144" width="130" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="139" y="160" text-anchor="middle" class="w">ui-text · Estado</text>
  <rect x="212" y="144" width="150" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="287" y="160" text-anchor="middle" class="w">ui-table · Problemas</text>

  <!-- ui-group: Clima, Riego, Actuadores (4 + 4 + 4) -->
  <rect x="60" y="188" width="252" height="160" rx="8" fill="#fcfcfb" stroke="#0d9488" stroke-width="1.5"/>
  <text x="74" y="208" class="titulo">ui-group · Clima</text>
  <text x="298" y="208" text-anchor="end" class="sub">ancho 4</text>
  <rect x="74" y="220" width="224" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="186" y="236" text-anchor="middle" class="w">ui-gauge · Temperatura interior</text>
  <rect x="74" y="250" width="224" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="186" y="266" text-anchor="middle" class="w">ui-gauge · Humedad del aire</text>
  <rect x="74" y="280" width="224" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="186" y="296" text-anchor="middle" class="w">ui-text · Exterior</text>

  <rect x="324" y="188" width="252" height="160" rx="8" fill="#fcfcfb" stroke="#0d9488" stroke-width="1.5"/>
  <text x="338" y="208" class="titulo">ui-group · Riego y agua</text>
  <text x="562" y="208" text-anchor="end" class="sub">ancho 4</text>
  <rect x="338" y="220" width="224" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="450" y="236" text-anchor="middle" class="w">ui-gauge · Humedad del suelo</text>
  <rect x="338" y="250" width="224" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="450" y="266" text-anchor="middle" class="w">ui-gauge (tank) · Depósito</text>
  <rect x="338" y="280" width="224" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="450" y="296" text-anchor="middle" class="w">ui-text · Calidad del agua</text>
  <rect x="338" y="310" width="224" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="450" y="326" text-anchor="middle" class="w">ui-text · Peso de la maceta</text>

  <rect x="588" y="188" width="252" height="160" rx="8" fill="#fcfcfb" stroke="#0d9488" stroke-width="1.5"/>
  <text x="602" y="208" class="titulo">ui-group · Actuadores</text>
  <text x="826" y="208" text-anchor="end" class="sub">ancho 4</text>
  <rect x="602" y="220" width="224" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="714" y="236" text-anchor="middle" class="w">ui-switch · Bomba de riego</text>
  <rect x="602" y="250" width="224" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="714" y="266" text-anchor="middle" class="w">ui-switch · Ventilador</text>
  <rect x="602" y="280" width="224" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="714" y="296" text-anchor="middle" class="w">ui-text · Ventilación</text>

  <text x="450" y="406" text-anchor="middle" class="sub">URL de la página:</text>
  <text x="450" y="422" text-anchor="middle" class="codigo">http://localhost:1880/dashboard/invernadero</text>
</svg>
