  <path d="M150,125 L183.8095238095238,133.33333333333331 L183.8095238095238,125 L217.61904761904762,133.33333333333331 L217.61904761904762,125 L251.42857142857142,133.33333333333331 L251.42857142857142,125 L285.23809523809524,133.33333333333331 L285.23809523809524,125 L319.04761904761904,133.33333333333331 L319.04761904761904,125 L352.85714285714283,133.33333333333331 L352.85714285714283,125 L386.66666666666663,133.33333333333331 L386.66666666666663,125 L589.5238095238095,175 L690.952380952381,175 L690.952380952381,125 L724.7619047619048,133.33333333333331 L724.7619047619048,125 L758.5714285714286,133.33333333333331 L758.5714285714286,125 L792.3809523809524,133.33333333333331 L792.3809523809524,125 L826.1904761904761,133.33333333333331 L826.1904761904761,125 L860,133.33333333333331" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>
