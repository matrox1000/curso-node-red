<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d">
  <title id="t">Watchdog con un nodo trigger de 30 segundos</title>
  <desc id="d">El sensor publica cada 5 segundos hasta el segundo 35 y luego calla. Cada mensaje reinicia la cuenta atrás de 30 segundos del trigger. Como no llega nada, la cuenta llega a cero en el segundo 65 y se emite el evento sin datos. En el segundo 80 vuelve a llegar un mensaje: se emite recuperado y la cuenta atrás empieza de nuevo.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1e293b; }
    .titulo { font-size: 14px; font-weight: 600; }
    .n { font-size: 13px; }
    .chip { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; }
    .sub { font-size: 12px; fill: #475569; }
    .etiqueta { font-size: 11px; fill: #64748b; }
    .codigo { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; font-weight: 700; }
  </style>
