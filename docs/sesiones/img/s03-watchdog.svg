  <text x="581.5238095238095" y="195" text-anchor="end" class="sub">llega a 0: el trigger envía "sin datos"</text>
  <text x="231.14285714285714" y="117" text-anchor="middle" class="etiqueta">cada mensaje la reinicia</text>
