  <text x="420.4761904761905" y="308" text-anchor="middle" class="etiqueta">40 s</text>
  <line x1="488.0952380952381" y1="40" x2="488.0952380952381" y2="272" stroke="#eef0f2" stroke-width="1"/>
  <text x="488.0952380952381" y="308" text-anchor="middle" class="etiqueta">50 s</text>
  <line x1="555.7142857142857" y1="40" x2="555.7142857142857" y2="272" stroke="#eef0f2" stroke-width="1"/>
  <text x="555.7142857142857" y="308" text-anchor="middle" class="etiqueta">60 s</text>
