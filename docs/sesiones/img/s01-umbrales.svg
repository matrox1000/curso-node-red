<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title id="t">Clasificación de la humedad del suelo por umbrales</title>
  <desc id="d">Humedad del suelo de un día sin riego, de 52 % a las 08:00 a 18 % a las 18:00. Por encima de 35 % el estado es normal, entre 25 y 35 % es aviso y por debajo de 25 % es crítico, que es cuando el flujo decide regar. La lectura pasa a aviso a las 13:40 y a crítico a las 16:20.</desc>
