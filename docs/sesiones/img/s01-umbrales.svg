  <text x="56" y="198.7" text-anchor="end" class="eje">20</text>
  <line x1="64" y1="156.0" x2="680" y2="156.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="56" y="160.0" text-anchor="end" class="eje">30</text>
  <line x1="64" y1="117.3" x2="680" y2="117.3" stroke="#e5e7eb" stroke-width="1"/>
  <text x="56" y="121.3" text-anchor="end" class="eje">40</text>
  <line x1="64" y1="78.7" x2="680" y2="78.7" stroke="#e5e7eb" stroke-width="1"/>
  <text x="56" y="82.7" text-anchor="end" class="eje">50</text>
  <line x1="64" y1="40.0" x2="680" y2="40.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="56" y="44.0" text-anchor="end" class="eje">60</text>
  <text x="64.0" y="290" text-anchor="middle" class="eje">08:00</text>
  <text x="187.2" y="290" text-anchor="middle" class="eje">10:00</text>
  <text x="310.4" y="290" text-anchor="middle" class="eje">12:00</text>
  <text x="433.6" y="290" text-anchor="middle" class="eje">14:00</text>
  <text x="556.8" y="290" text-anchor="middle" class="eje">16:00</text>
  <text x="680.0" y="290" text-anchor="middle" class="eje">18:00</text>
