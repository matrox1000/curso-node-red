    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1e293b; }
    .eje { font-size: 11px; fill: #52514e; font-variant-numeric: tabular-nums; }
    .banda { font-size: 12px; }
    .nota { font-size: 12px; font-weight: 600; }
  </style>
  <rect x="0.5" y="0.5" width="799" height="329" rx="12" fill="#fcfcfb" stroke="#e5e7eb"/>
  <text x="64" y="24" class="eje">Humedad del suelo (%)</text>
