<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura de la sesión 2</title>
  <desc id="d">Node-RED consulta cada 15 minutos la API de Open-Meteo, guarda la previsión en el contexto global y la usa, junto con la temperatura interior recibida por MQTT, para decidir si ventilar. Un endpoint propio GET /api/invernadero/estado devuelve ese estado a un navegador o a un programa Python.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1e293b; }
    .titulo { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: #475569; }
    .nodo { font-size: 13px; }
    .etiqueta { font-size: 11px; fill: #64748b; }
    .cable { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .ctx { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  </style>

  <rect class="superficie" x="0.5" y="0.5" width="879" height="379" rx="12" fill="#fcfcfb" stroke="#e5e7eb"/>

  <!-- Servicio externo -->
  <rect x="710" y="40" width="150" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="785" y="67" text-anchor="middle" class="titulo">Open-Meteo</text>
  <text x="785" y="88" text-anchor="middle" class="sub">API REST externa</text>

  <!-- Broker del invernadero -->
  <rect x="20" y="150" width="150" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="95" y="177" text-anchor="middle" class="titulo">RPi · MQTT</text>
  <text x="95" y="198" text-anchor="middle" class="sub">dht22/temperatura</text>

  <!-- Cliente de la API propia -->
  <rect x="710" y="286" width="150" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="785" y="313" text-anchor="middle" class="titulo">Navegador</text>
  <text x="785" y="334" text-anchor="middle" class="sub">curl · Python</text>

  <!-- Node-RED -->
  <rect x="200" y="16" width="480" height="348" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="216" y="40" class="titulo" style="fill:#9f1239">Node-RED · tu PC</text>

  <rect x="220" y="56" width="190" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="315" y="81" text-anchor="middle" class="nodo">inject · cada 15 min</text>

  <rect x="470" y="56" width="190" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="565" y="81" text-anchor="middle" class="nodo">http request</text>

  <rect x="470" y="126" width="190" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="565" y="151" text-anchor="middle" class="nodo">extraer previsión</text>

  <rect x="470" y="200" width="190" height="52" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-dasharray="5 4"/>
  <text x="565" y="222" text-anchor="middle" class="nodo">contexto global</text>
  <text x="565" y="241" text-anchor="middle" class="sub">meteo · ventilacion</text>

  <rect x="220" y="162" width="190" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="315" y="187" text-anchor="middle" class="nodo">mqtt in · temperatura</text>

  <rect x="220" y="232" width="190" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="315" y="257" text-anchor="middle" class="nodo">decidir ventilación</text>

  <rect x="470" y="292" width="190" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="565" y="312" text-anchor="middle" class="nodo">http in → http response</text>
  <text x="565" y="330" text-anchor="middle" class="sub">GET /api/invernadero/estado</text>

  <!-- Cables del flujo -->
  <line x1="410" y1="76" x2="468" y2="76" class="cable" marker-end="url(#flecha)"/>
  <line x1="565" y1="96" x2="565" y2="124" class="cable" marker-end="url(#flecha)"/>
  <line x1="565" y1="166" x2="565" y2="198" class="cable" marker-end="url(#flecha)"/>
  <line x1="170" y1="182" x2="218" y2="182" class="cable" marker-end="url(#flecha)"/>
  <line x1="315" y1="202" x2="315" y2="230" class="cable" marker-end="url(#flecha)"/>

  <!-- Petición a la API externa -->
  <line x1="660" y1="66" x2="708" y2="66" class="cable" marker-end="url(#flecha)"/>
  <text x="684" y="59" text-anchor="middle" class="etiqueta">GET</text>
  <line x1="708" y1="88" x2="662" y2="88" class="cable" marker-end="url(#flecha)"/>
  <text x="684" y="102" text-anchor="middle" class="etiqueta">JSON</text>

  <!-- Accesos al contexto -->
  <line x1="412" y1="250" x2="468" y2="230" class="ctx" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
  <text x="441" y="278" text-anchor="middle" class="etiqueta">lee / escribe</text>
  <line x1="565" y1="252" x2="565" y2="290" class="ctx" marker-end="url(#flecha)"/>
  <text x="574" y="276" class="etiqueta">lee</text>

  <!-- API propia -->
  <line x1="708" y1="306" x2="662" y2="306" class="cable" marker-end="url(#flecha)"/>
  <text x="684" y="299" text-anchor="middle" class="etiqueta">GET</text>
  <line x1="662" y1="330" x2="708" y2="330" class="cable" marker-end="url(#flecha)"/>
  <text x="684" y="344" text-anchor="middle" class="etiqueta">JSON</text>
</svg>
