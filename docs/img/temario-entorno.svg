<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" role="img" aria-labelledby="t d">
  <title id="t">Entorno de trabajo en el laboratorio y en casa</title>
  <desc id="d">En el laboratorio, los ESP32 publican en sus brokers, la Raspberry Pi (192.168.0.10) los reúne mediante bridges y el Node-RED del PC se conecta a ella. En casa, dentro del propio PC, un simulador publica los mismos topics en un Mosquitto local al que se conecta Node-RED. Solo cambia el fichero .env.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1e293b; }
    .marco { font-size: 15px; font-weight: 700; }
    .titulo { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: #475569; }
    .etiqueta { font-size: 11px; fill: #64748b; }
    .codigo { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; fill: #1e293b; }
    .cable { stroke: #64748b; stroke-width: 1.6; fill: none; }
  </style>

  <rect class="superficie" x="0.5" y="0.5" width="939" height="379" rx="12" fill="#fcfcfb" stroke="#e5e7eb"/>

  <!-- ===== Laboratorio ===== -->
  <rect x="10" y="10" width="450" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="30" y="38" class="marco">En el laboratorio</text>
  <text x="30" y="58" class="sub">Wi-Fi del router del invernadero · 192.168.0.0/24</text>

  <rect x="30" y="80" width="170" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="115" y="104" text-anchor="middle" class="titulo">ESP32 × 7</text>
  <text x="115" y="124" text-anchor="middle" class="sub">192.168.0.100 – .140</text>
  <text x="115" y="142" text-anchor="middle" class="sub">un broker en cada uno</text>

  <rect x="30" y="230" width="170" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="115" y="256" text-anchor="middle" class="titulo">Raspberry Pi</text>
  <text x="115" y="277" text-anchor="middle" class="sub">192.168.0.10 · Mosquitto</text>

  <line x1="115" y1="156" x2="115" y2="228" class="cable" marker-end="url(#flecha)"/>
  <text x="124" y="197" class="etiqueta">bridges</text>

  <rect x="250" y="80" width="190" height="214" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="266" y="102" class="titulo">Tu PC · Docker</text>
  <rect x="263" y="118" width="164" height="56" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="345" y="142" text-anchor="middle" class="titulo">Node-RED</text>
  <text x="345" y="161" text-anchor="middle" class="sub">localhost:1880</text>
  <rect x="263" y="222" width="164" height="52" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="345" y="244" text-anchor="middle" class="titulo">InfluxDB</text>
  <text x="345" y="262" text-anchor="middle" class="sub">localhost:8086</text>
  <line x1="345" y1="174" x2="345" y2="220" class="cable" marker-end="url(#flecha)"/>

  <path d="M200,262 H225 V146 H261" class="cable" marker-end="url(#flecha)"/>
  <text x="216" y="204" class="etiqueta" text-anchor="middle" transform="rotate(-90 216 204)">MQTT · 1883</text>

  <rect x="30" y="316" width="410" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="44" y="339" class="codigo">.env →  MQTT_HOST=192.168.0.10   COMPOSE_PROFILES=</text>

  <!-- ===== Casa ===== -->
  <rect x="480" y="10" width="450" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="38" class="marco">En casa</text>
  <text x="500" y="58" class="sub">Sin invernadero: todo dentro de tu PC</text>

  <rect x="500" y="80" width="410" height="214" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="516" y="102" class="titulo">Tu PC · Docker</text>

  <rect x="516" y="118" width="140" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="586" y="142" text-anchor="middle" class="titulo">simulador</text>
  <text x="586" y="161" text-anchor="middle" class="sub">mismos topics</text>
  <rect x="516" y="222" width="140" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="586" y="244" text-anchor="middle" class="titulo">Mosquitto</text>
  <text x="586" y="262" text-anchor="middle" class="sub">local · 1883</text>
  <line x1="586" y1="174" x2="586" y2="220" class="cable" marker-end="url(#flecha)"/>

  <rect x="716" y="118" width="178" height="56" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="805" y="142" text-anchor="middle" class="titulo">Node-RED</text>
  <text x="805" y="161" text-anchor="middle" class="sub">localhost:1880</text>
  <rect x="716" y="222" width="178" height="52" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="805" y="244" text-anchor="middle" class="titulo">InfluxDB</text>
  <text x="805" y="262" text-anchor="middle" class="sub">localhost:8086</text>
  <line x1="805" y1="174" x2="805" y2="220" class="cable" marker-end="url(#flecha)"/>

  <path d="M656,248 H686 V146 H714" class="cable" marker-end="url(#flecha)"/>
  <text x="677" y="204" class="etiqueta" text-anchor="middle" transform="rotate(-90 677 204)">MQTT</text>

  <rect x="500" y="316" width="410" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="514" y="339" class="codigo">.env →  MQTT_HOST=mosquitto   COMPOSE_PROFILES=casa</text>
</svg>
