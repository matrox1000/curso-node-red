# =====================================================================
#  Broker central del invernadero (Raspberry Pi)
#  Se instala en /etc/mosquitto/conf.d/invernadero.conf
#
#  - Escucha a los alumnos en el puerto 1883, con usuario y ACL.
#  - Abre un puente (bridge) hacia el broker embebido de cada ESP32 y
#    reorganiza sus topics bajo la jerarquia comun invernadero/...
#  - Publica invernadero/<nodo>/online = 1/0 (retained) segun el estado
#    de cada puente, para saber si un ESP32 esta alcanzable.
# =====================================================================

# ---------------------------------------------------------------------
# Listener para los alumnos
# ---------------------------------------------------------------------
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# ---------------------------------------------------------------------
# Puentes hacia los ESP32
#
# Opciones comunes a todos los puentes:
#   try_private false           el broker embebido (sMQTTBroker) no entiende
#                               el flag privado de puente de Mosquitto
#   bridge_protocol_version     sMQTTBroker solo habla MQTT 3.1.1
#   bridge_attempt_unsubscribe  no enviar UNSUBSCRIBE al reconectar
#   notifications_local_only    el estado del puente se publica solo en la
#                               RPi, no en el ESP32
#   cleansession true           los sensores publican con retain: al
#                               reconectar se recibe el ultimo valor
#
# Sintaxis:  topic <patron> <in|out> <qos> <prefijo local> <prefijo remoto>
#   ESP32 "sensorTHbroker/temperatura" -> RPi "invernadero/dht11/temperatura"
# ---------------------------------------------------------------------

# --- TH DHT11 (ESP32-S3) ---------------------------------------------
connection esp-dht11
address 192.168.0.122:1883
remote_clientid rpi-puente-dht11
bridge_protocol_version mqttv311
try_private false
bridge_attempt_unsubscribe false
cleansession true
start_type automatic
restart_timeout 5 60
keepalive_interval 30
notifications true
notifications_local_only true
notification_topic invernadero/dht11/online
topic temperatura in 0 invernadero/dht11/ sensorTHbroker/
topic humedad in 0 invernadero/dht11/ sensorTHbroker/

