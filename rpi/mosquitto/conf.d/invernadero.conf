# --- Actuador: broker de los 2 Shelly Plug S -------------------------
# Estado y medidas entran (in); los comandos salen (out). Se separan las
# direcciones para no reenviar mensajes en bucle.
#   RPi "invernadero/shelly/<id>/relay/0/command" -> ESP "shellies/<id>/relay/0/command"
connection esp-actuador
address 192.168.0.100:1883
remote_clientid rpi-puente-actuador
bridge_protocol_version mqttv311
try_private false
bridge_attempt_unsubscribe false
cleansession true
start_type automatic
restart_timeout 5 60
keepalive_interval 30
notifications true
notifications_local_only true
notification_topic invernadero/actuador/online
topic +/relay/0 in 0 invernadero/shelly/ shellies/
topic +/relay/0/power in 0 invernadero/shelly/ shellies/
topic +/relay/0/energy in 0 invernadero/shelly/ shellies/
topic +/online in 0 invernadero/shelly/ shellies/
topic +/relay/0/command out 0 invernadero/shelly/ shellies/
topic command out 0 invernadero/shelly/ shellies/
